name: Auto Assign Reviewer (weekly rotation)

# PR이 열리면 스터디 멤버 중 한 명을 리뷰어로 자동 배정합니다.
# 리뷰어 배정은 ISO 주차 번호를 오프셋으로 사용해 매주 자동으로 로테이션됩니다.
# 멤버가 추가/변경되면 아래 members 배열만 수정하면 됩니다.

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  assign-reviewer:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request rotating reviewer
        uses: actions/github-script@v7
        with:
          script: |
            // 스터디 멤버 (GitHub 아이디). 순서가 로테이션 기준이 됩니다.
            const members = ["DevJunz", "yeseoLee", "Suyoung-Min", "clarityth", "min9u"];

            const author = context.payload.pull_request.user.login;
            const authorIndex = members.indexOf(author);

            // ISO 8601 기준 연중 주차 번호를 오프셋으로 사용 -> 매주 리뷰어 짝이 자동으로 바뀜
            function getISOWeek(date) {
              const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
              const dayNum = d.getUTCDay() || 7;
              d.setUTCDate(d.getUTCDate() + 4 - dayNum);
              const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
              return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            }
            const week = getISOWeek(new Date());
            const n = members.length;

            const baseIndex = authorIndex === -1 ? 0 : authorIndex;
            let reviewerIndex = (baseIndex + 1 + week) % n;
            // 목록에 없는 작성자이거나 우연히 자기 자신이 걸리면 한 칸 더 이동
            if (members[reviewerIndex] === author) {
              reviewerIndex = (reviewerIndex + 1) % n;
            }
            const reviewer = members[reviewerIndex];

            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: [reviewer],
              });
              console.log(`Requested review from @${reviewer} (week ${week})`);
            } catch (err) {
              console.log(`Failed to request review from @${reviewer}: ${err.message}`);
            }
